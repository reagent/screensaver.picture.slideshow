name: CI

on:
  push:
    branches: [development, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # addon.xml imports xbmc.python 3.0.1, so Kodi 19 Matrix (Python 3.8)
          # is the floor. 3.8 is not published for ubuntu-24.04.
          - python: "3.8"
            os: ubuntu-22.04
          # Kodi 20 Nexus / 21 Omega
          - python: "3.11"
            os: ubuntu-latest
          - python: "3.13"
            os: ubuntu-latest
    name: pytest (py${{ matrix.python }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest -v

  addon-checker:
    runs-on: ubuntu-latest
    name: kodi-addon-checker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install kodi-addon-checker

      - name: stage the addon as Kodi would receive it
        # Same code path the publish workflow uses, so the checker sees exactly
        # the fileset that ships. It reports development files as
        # non-whitelisted payload otherwise.
        run: python tools/build_repo.py public --staging staging

      - run: kodi-addon-checker --branch matrix staging/screensaver.picture.slideshow
